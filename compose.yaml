# Uso: docker compose up -d --build  →  http://localhost:8080 (PLAN §24.6)
#
# Todos los datos (la base y sus copias) quedan en la carpeta `datos/` del proyecto, montada en la
# API y fuera de git [R6 §15]: actualizar es `git pull` y relanzar [R6 §13]. Ni `docker compose
# down -v` la toca; borrar esa carpeta sí borra los tableros.
# El puerto queda atado a 127.0.0.1: desde afuera se entra por `tailscale serve` [R6 §11].
#
# Variables opcionales: SIMULADOR_PUERTO (8080), SIMULADOR_DATOS (./datos) y SIMULADOR_UID /
# SIMULADOR_GID (1000): la API corre con ese usuario, que debe ser el dueño de la carpeta.
name: simulador

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 64
  restart: unless-stopped

services:
  web:
    <<: *endurecido
    build:
      context: .
      target: web
      args:
        BUILD_ID: ${BUILD_ID:-local}
    image: simulador-web:latest
    ports:
      - '127.0.0.1:${SIMULADOR_PUERTO:-8080}:8080'
    tmpfs:
      - /tmp:size=32m
    mem_limit: 128m
    networks: [frente, fondo]
    depends_on: [api]

  api:
    <<: *endurecido
    build:
      context: .
      target: api
      args:
        BUILD_ID: ${BUILD_ID:-local}
    image: simulador-api:latest
    user: '${SIMULADOR_UID:-1000}:${SIMULADOR_GID:-1000}'
    volumes:
      - ${SIMULADOR_DATOS:-./datos}:/data
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    # Solo en la red interna: la API no tiene salida a internet.
    networks: [fondo]

networks:
  frente: {}
  fondo:
    internal: true
