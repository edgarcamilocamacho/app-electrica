# Uso: docker compose up -d --build  →  http://localhost:8080 (PLAN §24.6)
#
# El proyecto se llama siempre `simulador`, así el volumen de datos es `simulador_datos` aunque el
# repo se vuelva a clonar en otra carpeta: actualizar es traer el código y relanzar [R6 §13].
# El puerto queda atado a 127.0.0.1: desde afuera se entra por `tailscale serve` [R6 §11].
name: simulador

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 64
  restart: unless-stopped

services:
  web:
    <<: *endurecido
    build:
      context: .
      target: web
      args:
        BUILD_ID: ${BUILD_ID:-local}
    image: simulador-web:latest
    ports:
      - '127.0.0.1:${SIMULADOR_PUERTO:-8080}:8080'
    tmpfs:
      - /tmp:size=32m
    mem_limit: 128m
    networks: [frente, fondo]
    depends_on: [api]

  api:
    <<: *endurecido
    build:
      context: .
      target: api
      args:
        BUILD_ID: ${BUILD_ID:-local}
    image: simulador-api:latest
    volumes:
      - datos:/data
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    # Solo en la red interna: la API no tiene salida a internet.
    networks: [fondo]

volumes:
  datos:

networks:
  frente: {}
  fondo:
    internal: true
