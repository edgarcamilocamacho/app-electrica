# Política de caché por ruta (PLAN §16.1) y proxy de la API de tableros (PLAN §24.1). Viaja
# dentro de la imagen para no depender de la configuración del proveedor de hosting.

# Límite por cliente para la API. La IP real llega en X-Forwarded-For desde `tailscale serve`
# (o desde otro proxy en la red privada); de afuera de esas redes no se le cree.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Host con el que el navegador llegó, puerto incluido: la API lo compara con el Origin de cada
# escritura. Si otro proxy delante (`tailscale serve`) ya lo informó, se respeta el suyo.
map $http_x_forwarded_host $original_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    # DNS interno de Docker: `api` se resuelve en cada petición, así nginx arranca aunque la API
    # todavía no esté lista (mientras tanto, /api responde 502 y el cliente reintenta).
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Detección de versión nueva: nunca en caché.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # API de tableros. El cuerpo admite un tablero de 2 MB con sus escapes.
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        limit_except GET POST PUT PATCH DELETE { deny all; }
        client_max_body_size 5m;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $original_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # La API ya manda nosniff; nginx agrega todas las cabeceras de seguridad.
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Assets con hash de contenido: inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html y el resto: siempre frescos, para apuntar a los assets del build actual.
    location / {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
