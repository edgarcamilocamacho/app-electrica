# Política de caché por ruta (PLAN §16.1). Viaja dentro de la imagen para no
# depender de la configuración del proveedor de hosting.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Detección de versión nueva: nunca en caché.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Assets con hash de contenido: inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html y el resto: siempre frescos, para apuntar a los assets del build actual.
    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
